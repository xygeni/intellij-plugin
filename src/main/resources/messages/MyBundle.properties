mcp.setup.action.title=MCP Server Setup
mcp.setup.tab.title=Xygeni MCP Server Setup
mcp.setup.heading=Xygeni MCP Server Setup Guide
mcp.setup.intro=This guide explains how to set up an MCP (Model Context Protocol) server that uses Xygeni's local scanner JAR file to provide security analysis tools to AI assistants.
mcp.setup.section.whatIsMcp=What is MCP?
mcp.setup.whatIsMcp.body=MCP (Model Context Protocol) is a protocol that enables AI assistants to access external tools and data sources. Xygeni's MCP server exposes security scanning capabilities through standardized tool interfaces.
mcp.setup.section.features=Features
mcp.setup.features.scanners=Scanners
mcp.setup.features.suspectDeps=Suspect dependencies analysis
mcp.setup.features.secrets=Secrets detection
mcp.setup.features.iac=IaC (Infrastructure as Code) security scanning
mcp.setup.features.cicd=CI/CD misconfiguration detection
mcp.setup.features.malware=Malware evidence analysis
mcp.setup.features.tampering=Code tampering analysis
mcp.setup.features.compliance=Compliance analysis
mcp.setup.features.inventory=Inventory analysis
mcp.setup.features.guardrails=Audit guardrails
mcp.setup.features.guardrails.body=Run the project's configured guardrails for any scan type (SAST, SCA, suspect deps, secrets, IaC, CI/CD, malware, code tampering, compliance) and get the audit verdict.
mcp.setup.features.aiRemediation=AI-assisted remediation
mcp.setup.features.aiRemediation.sast=Generate fix for SAST issues at a given file/line/detector
mcp.setup.features.aiRemediation.sca=Generate fix for SCA issues for a given dependency
mcp.setup.features.aiRemediation.risk=Remediation risk: assess impact of bumping a component from a version to a fixed version
mcp.setup.features.issueMgmt=Issue management
mcp.setup.features.issueMgmt.baseline=Find new issues from baseline by comparing the latest scan against the project baseline
mcp.setup.features.issueMgmt.mute=Mute issues by unique hash with a reason
mcp.setup.section.prerequisites=Prerequisites
mcp.setup.prereq.title=Install Xygeni Scanner
mcp.setup.prereq.body=Set up your Xygeni API URL and authentication token and ensure the Xygeni scanner is properly installed through the IntelliJ plugin.
mcp.setup.section.setupInstructions=Setup Instructions
mcp.setup.note.label=Note:
mcp.setup.note.autoDownload=The Xygeni MCP server JAR is automatically downloaded when you install the scanner.
mcp.setup.warning.tokenInClear=<strong>Security note:</strong> The following examples include your current <code>XYGENI_TOKEN</code> in clear text under <code>servers.env</code>. Keep this file private.
mcp.setup.warning.noToken=<strong>Warning:</strong> No token is currently stored in Xygeni settings. Replace <code>$XYGENI_TOKEN</code> with your real token before using the config.
mcp.setup.step1.title=Step 1: Create MCP Server Configuration
mcp.setup.step1.body=Create a new MCP server configuration file. Use JSON or TOML depending on your MCP client:
mcp.setup.step2.title=Step 2: Give the configuration to your AI assistant
mcp.setup.step2.body=Each assistant reads it from its own file. The JSON above is in the VS Code format (top key "servers"); the others call that key "mcpServers", everything inside stays the same.
mcp.setup.step2.copilot=GitHub Copilot in VS Code: create .vscode/mcp.json in your project and paste the JSON as is. For every project: Command Palette, "MCP: Open User Configuration", and paste it there.
mcp.setup.step2.claudeCode=Claude Code: create .mcp.json at the project root with the JSON, renaming "servers" to "mcpServers". Or in a terminal: claude mcp add-json xygeni-mcp-server <the object under servers>.
mcp.setup.step2.cursor=Cursor: .cursor/mcp.json in the project (or ~/.cursor/mcp.json for all of them), key "mcpServers".
mcp.setup.step2.claudeDesktop=Claude Desktop: Settings, Developer, "Edit Config" opens claude_desktop_config.json; key "mcpServers".
mcp.setup.step2.codex=Codex CLI: ~/.codex/config.toml with the TOML above, renaming [servers.…] to [mcp_servers.…].
mcp.setup.step2.other=Any other assistant: look for "MCP servers" in its settings and add a stdio server with the same command, arguments and environment.
mcp.setup.step2.then=Then start (or restart) the assistant so it reads the file:
mcp.setup.step3.title=Step 3: Check that it works
mcp.setup.step3.copilot=Copilot in VS Code: Command Palette, "MCP: List Servers": xygeni-mcp-server should say Running, and the chat tools picker lists the Xygeni tools.
mcp.setup.step3.claudeCode=Claude Code: type /mcp; xygeni-mcp-server should be connected.
mcp.setup.step3.any=Any assistant: ask it "Using Xygeni, scan this project for secrets". It should call a Xygeni tool and report findings.
mcp.setup.trouble.title=If something fails
mcp.setup.trouble.java="java: command not found" or the server never starts: install Java 17 or later, or point JAVA_HOME in the configuration to it.
mcp.setup.trouble.noTools=The assistant lists the server but no Xygeni tools: restart the assistant; it was started before the configuration or before an update.
mcp.setup.trouble.token=401 / 403 or "invalid token": the token in the configuration is not the one of this plugin any more. Copy the configuration again from this page.
mcp.setup.trouble.manual=To see the real error, run in a terminal, with XYGENI_URL and XYGENI_TOKEN set:
mcp.setup.prereq.java.title=Java 17 or later
mcp.setup.prereq.java.body=The MCP server is a Java program: your AI assistant starts it with "java -jar". Check with "java -version" in a terminal. The configuration below sets JAVA_HOME to {0}; change it if your Java lives elsewhere.
mcp.setup.restart.title=After an update: restart your AI assistant
mcp.setup.restart.body=An update only replaces the Xygeni MCP server file in ~/.xygeni/mcp. The AI assistant that uses it (Copilot, Claude Code, Cursor, Claude Desktop…) keeps the old version loaded until it is restarted:
mcp.setup.restart.copilot=GitHub Copilot in VS Code: Command Palette, "MCP: List Servers", xygeni, Restart. Or simply reload the VS Code window.
mcp.setup.restart.claudeCode=Claude Code: type /mcp and reconnect xygeni. Or close Claude Code and open it again.
mcp.setup.restart.cursor=Cursor: Settings, MCP, switch xygeni off and on. Or restart Cursor.
mcp.setup.restart.claudeDesktop=Claude Desktop: quit the application and open it again.
mcp.setup.restart.other=Any other assistant: close it and open it again. Its Xygeni configuration does not change.
mcp.setup.restart.none=Not using an AI assistant with Xygeni yet? Nothing to do: the first start already loads the new version.
mcp.setup.restart.banner=Updated to {0}. Your AI assistant keeps the old version until it is restarted. How, for each one:
mcp.setup.restart.bannerFoot=Not using an AI assistant with Xygeni yet? Nothing to do. Hide this note with OK in the Configuration panel.
