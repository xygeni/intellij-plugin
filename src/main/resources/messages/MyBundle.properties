mcp.setup.action.title=MCP Server Setup
mcp.setup.tab.title=Xygeni MCP Server Setup
mcp.setup.heading=Xygeni MCP Server Setup Guide
mcp.setup.intro=This guide explains how to set up an MCP (Model Context Protocol) server that uses Xygeni's local scanner JAR file to provide security analysis tools to AI assistants.
mcp.setup.section.whatIsMcp=What is MCP?
mcp.setup.whatIsMcp.body=MCP (Model Context Protocol) is a protocol that enables AI assistants to access external tools and data sources. Xygeni's MCP server exposes security scanning capabilities through standardized tool interfaces.
mcp.setup.section.features=Features
mcp.setup.features.scanners=Scanners
mcp.setup.features.suspectDeps=Suspect dependencies analysis
mcp.setup.features.secrets=Secrets detection
mcp.setup.features.iac=IaC (Infrastructure as Code) security scanning
mcp.setup.features.cicd=CI/CD misconfiguration detection
mcp.setup.features.malware=Malware evidence analysis
mcp.setup.features.tampering=Code tampering analysis
mcp.setup.features.compliance=Compliance analysis
mcp.setup.features.inventory=Inventory analysis
mcp.setup.features.guardrails=Audit guardrails
mcp.setup.features.guardrails.body=Run the project's configured guardrails for any scan type (SAST, SCA, suspect deps, secrets, IaC, CI/CD, malware, code tampering, compliance) and get the audit verdict.
mcp.setup.features.aiRemediation=AI-assisted remediation
mcp.setup.features.aiRemediation.sast=Generate fix for SAST issues at a given file/line/detector
mcp.setup.features.aiRemediation.sca=Generate fix for SCA issues for a given dependency
mcp.setup.features.aiRemediation.risk=Remediation risk: assess impact of bumping a component from a version to a fixed version
mcp.setup.features.issueMgmt=Issue management
mcp.setup.features.issueMgmt.baseline=Find new issues from baseline by comparing the latest scan against the project baseline
mcp.setup.features.issueMgmt.mute=Mute issues by unique hash with a reason
mcp.setup.section.prerequisites=Prerequisites
mcp.setup.prereq.title=Install Xygeni Scanner
mcp.setup.prereq.body=Set up your Xygeni API URL and authentication token and ensure the Xygeni scanner is properly installed through the IntelliJ plugin.
mcp.setup.section.setupInstructions=Setup Instructions
mcp.setup.note.label=Note:
mcp.setup.note.autoDownload=The Xygeni MCP server JAR is automatically downloaded when you install the scanner.
mcp.setup.warning.tokenInClear=<strong>Security note:</strong> The following examples include your current <code>XYGENI_TOKEN</code> in clear text under <code>servers.env</code>. Keep this file private.
mcp.setup.warning.noToken=<strong>Warning:</strong> No token is currently stored in Xygeni settings. Replace <code>$XYGENI_TOKEN</code> with your real token before using the config.
mcp.setup.step1.title=Step 1: Create MCP Server Configuration
mcp.setup.step1.body=Create a new MCP server configuration file. Use JSON or TOML depending on your MCP client:
mcp.setup.step2.title=Step 2: Configure Your MCP Client
mcp.setup.step2.body=Depending on your MCP client (IDE extension or AI assistant), follow these general steps:
mcp.setup.step2.bullet1=Locate your MCP configuration file (usually mcp.json, .mcp/config.json, or client-specific mcp.toml)
mcp.setup.step2.bullet2=Add the Xygeni server configuration as shown above
mcp.setup.step2.bullet3=Restart your MCP client or reload the configuration
mcp.setup.copyJson=Copy JSON Config
mcp.setup.copyToml=Copy TOML Config
mcp.setup.notInstalled=Please install the Xygeni scanner first to access MCP server setup instructions and available tools.
